<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Ganesha Store — Order Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="30" height="30">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M24 14a6 6 0 100 12 6 6 0 000-12z" fill="currentColor"/>
        <path d="M14 33c2-5 6-8 10-8s8 3 10 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="topbar__title">
      <h1 id="storeName">Ganesha Store</h1>
      <span>Order Desk</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="new-order" role="tab">New Order</button>
    <button class="tab" data-tab="dashboard" role="tab">Dashboard</button>
    <button class="tab" data-tab="search" role="tab">Search</button>
  </nav>

  <main class="screen-wrap">

    <!-- ===================== NEW ORDER ===================== -->
    <section id="new-order" class="screen is-active">
      <form id="orderForm" class="card" novalidate>

        <div class="field-group">
          <h2 class="section-title">Customer</h2>
          <label class="field">
            <span>Customer name</span>
            <input type="text" name="customerName" required autocomplete="off" />
          </label>
          <div class="field-row">
            <label class="field">
              <span>Mobile number</span>
              <input type="tel" name="phone" placeholder="9876543210" required />
            </label>
            <label class="field">
              <span>WhatsApp number <em>(if different)</em></span>
              <input type="tel" name="whatsappNumber" placeholder="Same as mobile" />
            </label>
          </div>
          <label class="field">
            <span>Email <em>(optional)</em></span>
            <input type="email" name="email" />
          </label>
        </div>

        <div class="field-group">
          <h2 class="section-title">Order</h2>
          <div class="field-row">
            <label class="field field--grow">
              <span>Product / Ganesha idol</span>
              <input type="text" name="product" placeholder="e.g. Eco Ganesha, 2 ft" required />
            </label>
            <label class="field field--narrow">
              <span>Quantity</span>
              <input type="number" name="quantity" min="1" value="1" required />
            </label>
          </div>
          <label class="field">
            <span>Order notes <em>(optional)</em></span>
            <textarea name="notes" rows="2" placeholder="Any special instructions"></textarea>
          </label>
        </div>

        <div class="field-group">
          <h2 class="section-title">Pickup / Delivery</h2>
          <div class="field-row">
            <label class="field">
              <span>Type</span>
              <select name="orderType">
                <option value="Pickup">Pickup</option>
                <option value="Delivery">Delivery</option>
              </select>
            </label>
            <label class="field">
              <span>Date</span>
              <input type="date" name="pickupDateInput" required />
            </label>
            <label class="field">
              <span>Time</span>
              <input type="time" name="pickupTimeInput" required />
            </label>
          </div>
          <p class="hint" id="reminderPreview"></p>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">
          Place Order
        </button>

        <div id="formErrors" class="alert alert--error is-hidden"></div>
      </form>
    </section>

    <!-- ===================== SUCCESS ===================== -->
    <section id="success" class="screen">
      <div class="card success-card">
        <div class="success-card__icon">✓</div>
        <h2>Order Successfully Placed</h2>
        <p class="success-card__order-id" id="successOrderId"></p>

        <dl class="success-card__list">
          <div><dt>Thank-you message</dt><dd id="successThankYou">—</dd></div>
          <div><dt>Reminder</dt><dd id="successReminder">—</dd></div>
        </dl>

        <div id="successWarning" class="alert alert--warning is-hidden"></div>

        <button class="btn btn--primary btn--block" id="newOrderAgainBtn">Place Another Order</button>
      </div>
    </section>

    <!-- ===================== DASHBOARD ===================== -->
    <section id="dashboard" class="screen">
      <div class="dash-block">
        <h2 class="section-title">Today's Orders</h2>
        <div id="todayList" class="order-list"><p class="empty">Loading…</p></div>
      </div>
      <div class="dash-block">
        <h2 class="section-title">Upcoming Orders</h2>
        <div id="upcomingList" class="order-list"><p class="empty">Loading…</p></div>
      </div>
    </section>

    <!-- ===================== SEARCH ===================== -->
    <section id="search" class="screen">
      <div class="card">
        <label class="field">
          <span>Search by Order ID, customer name, or phone</span>
          <input type="text" id="searchInput" placeholder="Start typing…" />
        </label>
      </div>
      <div id="searchResults" class="order-list"></div>
    </section>

  </main>

  <!-- Order detail / status editor -->
  <div id="orderModal" class="modal is-hidden">
    <div class="modal__panel card">
      <button class="modal__close" id="modalClose" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
